<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@600;700&amp;family=Source+Sans+3:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "outfit": ["Outfit", "sans-serif"],
                        "sourcesans": ["Source Sans 3", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden bg-gradient-to-b from-slate-50 to-white dark:from-background-dark dark:to-background-dark">

</div>

<div class="max-w-[600px] w-full text-center flex flex-col items-center">
<!-- Icon: Minimalist FileQuestion (represented by Material Symbols) -->
<div class="mb-8 flex items-center justify-center">
<div class="w-[120px] h-[120px] rounded-3xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-[80px] text-slate-300 dark:text-slate-600">contact_support</span>
</div>
</div>
<!-- Title -->
<h1 class="text-slate-900 dark:text-slate-100 text-4xl md:text-5xl font-bold font-outfit tracking-tight mb-4">
                        Sayfa Bulunamadı
                    </h1>
<!-- Subtitle -->
<p class="text-slate-500 dark:text-slate-400 text-lg font-sourcesans leading-relaxed mb-10 max-w-[420px]">

                    </p>
<!-- Buttons -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center px-4">
<button class="flex min-w-[180px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl h-12 px-6 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-wide transition-all shadow-lg shadow-primary/20">

<span class="material-symbols-outlined text-xl">arrow_back</span>
<span>Geri Git</span>
</button>

<div class="mt-16 w-full max-w-sm h-1 bg-gradient-to-r from-transparent via-slate-200 dark:via-slate-800 to-transparent"></div>
