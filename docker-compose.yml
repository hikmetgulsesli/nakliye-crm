services:
  # External postgres kullananlarin buna ihtiyaci yok. Compose icinde lokal DB
  # kurmak isterseniz: `docker compose --profile embedded-db up --build`
  db:
    profiles: ["embedded-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nakliye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakliye}
      POSTGRES_DB: ${POSTGRES_DB:-nakliye_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakliye} -d ${POSTGRES_DB:-nakliye_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 80
      # DATABASE_URL: Dokploy / .env tarafindan verilir.
      # embedded-db profile aktif olursa fallback olarak compose-ici postgres kullanilir.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nakliye}:${POSTGRES_PASSWORD:-nakliye}@db:5432/${POSTGRES_DB:-nakliye_crm}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env degiskeni zorunlu}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET env degiskeni zorunlu}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nakliye.setrox.com.tr}
      DISABLE_SEED: ${DISABLE_SEED:-0}
    ports:
      # Host 3505 -> container 80 (local ve uzak sunucu ayni)
      - "${APP_PORT:-3505}:80"

volumes:
  postgres_data:
    driver: local
