services:
  # External postgres kullananlarin buna ihtiyaci yok. Compose icinde lokal DB
  # kurmak isterseniz: `docker compose --profile embedded-db up --build`
  db:
    profiles: ["embedded-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nakliye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakliye}
      POSTGRES_DB: ${POSTGRES_DB:-nakliye_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakliye} -d ${POSTGRES_DB:-nakliye_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis - BullMQ job queue backend. Opsiyonel; USE_REDIS=false ile devre disi
  # birakilabilir (in-process setInterval fallback).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 80
      # DATABASE_URL zorunlu. Dokploy / .env tarafindan verilmeli.
      # Embedded postgres kullanacaksaniz:
      #   DATABASE_URL=postgresql://nakliye:nakliye@db:5432/nakliye_crm
      #   docker compose --profile embedded-db up --build
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL env degiskeni zorunlu (Dokploy Environment sekmesinden ekleyin)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env degiskeni zorunlu}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET env degiskeni zorunlu}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nakliye.setrox.com.tr}
      DISABLE_SEED: ${DISABLE_SEED:-0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      USE_REDIS: ${USE_REDIS:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      # Host 3505 -> container 80 (local ve uzak sunucu ayni)
      - "${APP_PORT:-3505}:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
